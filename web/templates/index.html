<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA OS v4.1.0</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💜</text></svg>">
    <link rel="stylesheet" href="/static/css/style.css?v=71">
    <meta http-equiv="Cache-Control" content="no-cache">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><div class="logo">AURA OS</div><div class="version">v4.1</div></div>
        <nav class="sidebar-nav">
            <a href="#" class="nav-item active" data-page="chat"><span class="nav-icon">💬</span><span>Общение</span></a>
            <a href="#" class="nav-item" data-page="calendar"><span class="nav-icon">📅</span><span>Календарь</span></a>
            <a href="#" class="nav-item" data-page="skills"><span class="nav-icon">🧩</span><span>Скиллы</span></a>
            <a href="#" class="nav-item" data-page="logs"><span class="nav-icon">📋</span><span>Логи</span></a>
            <a href="#" class="nav-item" data-page="backups"><span class="nav-icon">💾</span><span>Бекапы</span></a>
            <a href="#" class="nav-item" data-page="settings"><span class="nav-icon">⚙️</span><span>Настройки</span></a>
        </nav>
        <div class="sidebar-footer">
            <div class="connection-status"><span class="status-dot"></span><span class="status-text">Подключено</span></div>
            <div class="network-info"><a href="http://localhost:{{ port }}" target="_blank" class="net-link">🏠 localhost:{{ port }}</a></div>
        </div>
    </aside>

    <main class="main-content">
        <section id="page-chat" class="page active">
            <header class="page-header">
                <h1>Общение с Аурой</h1>
                <div class="header-actions">
                    <button class="btn btn-sm" id="btn-theme" onclick="toggleTheme()">🎨 Тёплая</button>
                    <button class="btn btn-sm btn-primary" id="btn-mode-aura" onclick="setChatMode('aura')">Твоя Аура</button>
                    <button class="btn btn-sm" id="btn-mode-expert" onclick="setChatMode('expert')">Эксперт</button>
                    <button class="btn btn-sm" id="btn-pause" onclick="toggleChatPause()">⏸️</button>
                </div>
            </header>
            <div class="chat-container">
                <div class="chat-messages" id="chatMessages">
                    <div class="chat-message assistant">
                        <div class="message-avatar">💖</div>
                        <div class="message-body">
                            <div class="message-content" id="welcomeMsg">Привет! Я Аура. Чем могу помочь?</div>
                            <div class="message-time">--:--</div>
                        </div>
                    </div>
                </div>
                <div class="chat-input-area">
                    <textarea id="chatInput" placeholder="Напиши Ауре..." rows="2"
                        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChatMessage()}"></textarea>
                    <button class="btn btn-sm" id="btn-mic" onclick="toggleVoiceInput()" title="Голосовой ввод">🎤</button>
                    <button class="btn btn-primary" onclick="sendChatMessage()">Отправить</button>
                </div>
            </div>
        </section>

        <section id="page-calendar" class="page">
            <header class="page-header">
                <h1>Календарь</h1>
                <div class="header-actions">
                    <button class="btn btn-sm" onclick="calendarPrevMonth()">◀</button>
                    <span id="calendarMonthLabel" style="font-weight:600;min-width:160px;text-align:center"></span>
                    <button class="btn btn-sm" onclick="calendarNextMonth()">▶</button>
                    <button class="btn btn-sm btn-primary" id="btn-view-month" onclick="switchCalendarView('month')">Месяц</button>
                    <button class="btn btn-sm" id="btn-view-week" onclick="switchCalendarView('week')">Неделя</button>
                    <button class="btn btn-sm btn-primary" onclick="syncCalendar()" style="background:var(--success);border-color:transparent">🔄 Синхр</button>
                </div>
            </header>
            <div class="calendar-grid" id="calendarGrid"></div>
            <div class="calendar-day-detail" id="calendarDayDetail" style="display:none">
                <h3 id="calendarDayTitle"></h3>
                <div id="calendarDayEvents"></div>
            </div>
        </section>

        <section id="page-skills" class="page">
            <header class="page-header"><h1>Скиллы</h1></header>
            <div id="skillsStats" class="skills-stats"></div>
            <div class="skills-grid" id="skillsGrid"></div>
        </section>

        <section id="page-logs" class="page">
            <header class="page-header"><h1>Логи</h1></header>
            <div class="log-container" id="logContainer"></div>
        </section>

        <section id="page-backups" class="page">
            <header class="page-header"><h1>Бекапы</h1><div class="header-actions"><button class="btn btn-primary" onclick="createBackup()">Создать</button></div></header>
            <div id="backupList" class="backup-list"></div>
        </section>

        <section id="page-settings" class="page">
            <header class="page-header"><h1>Настройки</h1></header>
            <div id="settingsContainer" class="card"><p>Загрузка...</p></div>
        </section>
    </main>

    <button class="scroll-bottom" id="scrollBottom" onclick="scrollToBottom()" title="К последнему сообщению">↓</button>

    <!-- Skills Code Editor Modal -->
    <div class="modal" id="codeEditorModal">
        <div class="modal-box" style="max-width:700px;padding:var(--s-5)">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
                <h2 id="codeEditorTitle">Редактор кода</h2>
                <div style="display:flex;gap:4px">
                    <button class="btn btn-sm" id="btn-edit-skillpy" onclick="switchEditorTab('skillpy')">skill.py</button>
                    <button class="btn btn-sm" id="btn-edit-manifest" onclick="switchEditorTab('manifest')">manifest</button>
                    <button class="btn btn-sm" id="btn-edit-skillmd" onclick="switchEditorTab('skillmd')">SKILL.md</button>
                    <button class="btn btn-sm" id="btn-edit-toggle" onclick="toggleEditorView()" title="Подсветка">💡</button>
                    <button class="btn btn-sm btn-primary" onclick="saveSkillCode()">💾 Сохранить</button>
                    <button class="btn btn-sm" onclick="closeCodeEditor()">✕</button>
                </div>
            </div>
            <textarea id="codeEditorTextarea" spellcheck="false" style="width:100%;height:400px;background:#0a0a12;border:1px solid var(--border-default);border-radius:6px;color:#d4d4d8;padding:12px;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.5;resize:vertical;tab-size:4;white-space:pre;overflow:auto"
                oninput="onEditorInput()" onkeydown="onEditorKey(event)"></textarea>
            <pre id="codeEditorPreview" style="display:none;width:100%;height:400px;background:#0a0a12;border:1px solid var(--border-default);border-radius:6px;padding:12px;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.5;overflow:auto;margin:0;white-space:pre;tab-size:4"><code id="codeEditorHighlight" class="language-python"></code></pre>
            <div id="codeEditorStatus" style="margin-top:8px;font-size:12px"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="/static/js/app.js?v=72"></script>
    <script src="/static/js/chat.js?v=72"></script>
    <script src="/static/js/calendar.js?v=71"></script>
    <script src="/static/js/skills.js?v=71"></script>
    <script src="/static/js/logs.js?v=71"></script>
    <script src="/static/js/backups.js?v=71"></script>
    <script src="/static/js/settings.js?v=72"></script>

    <script>
        // Editor toggle: plain text ↔ syntax highlighted
        let editorView = 'edit';
        function toggleEditorView() {
            editorView = editorView === 'edit' ? 'preview' : 'edit';
            const ta = document.getElementById('codeEditorTextarea');
            const pr = document.getElementById('codeEditorPreview');
            const btn = document.getElementById('btn-edit-toggle');
            if (editorView === 'preview') {
                syncHighlight();
                ta.style.display = 'none';
                pr.style.display = 'block';
                btn.textContent = '✏️';
            } else {
                ta.style.display = '';
                pr.style.display = 'none';
                btn.textContent = '💡';
            }
        }
        function onEditorInput() {
            if (editorView === 'preview') syncHighlight();
        }
        function onEditorKey(e) {
            if (e.key === 'Tab') { e.preventDefault(); const ta = e.target; const s = ta.selectionStart; ta.value = ta.value.substring(0,s) + '    ' + ta.value.substring(ta.selectionEnd); ta.selectionStart = ta.selectionEnd = s+4; }
            setTimeout(() => { if (editorView === 'preview') syncHighlight(); }, 100);
        }
        function syncHighlight() {
            const code = document.getElementById('codeEditorTextarea').value;
            const hl = document.getElementById('codeEditorHighlight');
            hl.textContent = code;
            hl.className = editorTab === 'manifest' ? 'language-json' : editorTab === 'skillmd' ? 'language-markdown' : 'language-python';
            hljs.highlightElement(hl);
        }
        function switchEditorTab(tab) {
            editorTab = tab;
            document.getElementById('btn-edit-manifest').classList.toggle('btn-primary', tab === 'manifest');
            document.getElementById('btn-edit-skillmd').classList.toggle('btn-primary', tab === 'skillmd');
            document.getElementById('btn-edit-skillpy').classList.toggle('btn-primary', tab === 'skillpy');
            const key = tab === 'manifest' ? 'manifest.json' : tab === 'skillmd' ? 'SKILL.md' : 'skill.py';
            document.getElementById('codeEditorTextarea').value = editorCode[key] || '';
            document.getElementById('codeEditorStatus').innerHTML = '';
            if (editorView === 'preview') syncHighlight();
        }
        const THEMES = ['', 'slate', 'forest', 'amethyst', 'rose'];
        const THEME_LABELS = {'':'Тёплая','slate':'Синяя','forest':'Зелёная','amethyst':'Фиолетовая','rose':'Розовая'};
        let themeIdx = 0;
        function toggleTheme() {
            themeIdx = (themeIdx + 1) % THEMES.length;
            const t = THEMES[themeIdx];
            t ? document.documentElement.setAttribute('data-theme', t) : document.documentElement.removeAttribute('data-theme');
            const b = document.getElementById('btn-theme'); if (b) b.textContent = '🎨 ' + THEME_LABELS[t];
        }
        async function syncCalendar() { try { await fetch('/api/calendar/sync', { method: 'POST' }); loadCalendarView(7); } catch (e) {} }
        function createBackup() { fetch('/api/backups/create', { method: 'POST' }).then(r => r.json()).then(() => loadBackups()); }
    </script>
</body>
</html>
